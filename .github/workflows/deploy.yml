name: Deploy to OVH (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest social posts
        run: node scripts/fetch-social-posts.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

      # Aligne les fichiers de repli versionnés sur ce que l'admin PHP a
      # réellement publié, pour que le HTML généré contienne la FAQ et le
      # catalogue à jour plutôt qu'un contenu figé. N'échoue jamais : en cas
      # d'incident réseau, le repli du dépôt est conservé.
      - name: Sync live content into build fallbacks
        run: node scripts/fetch-contenu-live.mjs

      # Recopie les cotes des 28 remorques de src/data/remorques.ts vers le PHP
      # qui recalcule les dimensions de la Boîte côté serveur. Régénéré à chaque
      # build : les deux listes ne peuvent pas diverger en silence, ce qui
      # ferait afficher une cote et en facturer une autre. Le fichier produit
      # est aussi commité, pour que les tests locaux tournent sans build.
      - name: Generate PHP trailer data
        run: node scripts/generer-remorques-php.mjs

      - name: Build site
        run: npm run build

      - name: Write admin credentials
        run: node scripts/write-admin-config.mjs
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}

      # Écrit dist/api/config.php : identifiants de la newsletter et de l'admin,
      # plus les clés Stripe si elles existent. Un secret Stripe non défini vaut
      # la chaîne vide et n'est pas une erreur : le script l'ignore et le
      # paiement reste simplement indisponible dans ce mode. Les quatre clés
      # sont référencées d'avance pour que le passage au paiement réel ne
      # demande que d'ajouter le secret, sans toucher à ce fichier.
      - name: Write API credentials (newsletter, admin, Stripe)
        run: node scripts/write-api-config.mjs
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SMTP_LOGIN: ${{ secrets.SMTP_LOGIN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_TOKEN_SALT: ${{ secrets.NEWSLETTER_TOKEN_SALT }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./laboiteabivouac/
          # data/faq.json, data/questions.json, data/subscribers.json,
          # data/rate-limits.json et data/equipements.json sont écrits en live
          # par le PHP (voir public/admin/faq.php, public/admin/equipements.php,
          # public/ask-question.php, public/api/subscribe.php et
          # public/lib/rate-limit.php) : jamais commités, donc exclus du
          # déploiement pour ne pas être supprimés par ce sync. Même raison pour
          # les photos d'équipements téléversées depuis l'admin.
          #
          # Même logique pour le module commercial : data/settings.json porte
          # l'état de l'interrupteur, réglé depuis /admin/parametres.php, et
          # data/private/commerce.sqlite contient les comptes clients et les
          # commandes. Un déploiement qui les écraserait remettrait la boutique
          # dans un état arbitraire et détruirait des données de vente. Le
          # .htaccess du dossier data/private, lui, reste versionné et déployé :
          # c'est lui qui interdit l'accès HTTP à la base.
          exclude: |
            **/data/faq.json
            **/data/faq-libre.json
            **/data/questions.json
            **/data/subscribers.json
            **/data/rate-limits.json
            **/data/equipements.json
            **/data/settings.json
            **/data/private/commerce.sqlite
            **/data/private/commerce.sqlite-wal
            **/data/private/commerce.sqlite-shm
            **/uploads/equipements/**
            **/uploads/produits/**
