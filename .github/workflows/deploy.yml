name: Deploy to OVH (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest social posts
        run: node scripts/fetch-social-posts.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

      - name: Build site
        run: npm run build

      - name: Write admin credentials
        run: node scripts/write-admin-config.mjs
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./laboiteabivouac/
          # data/faq.json et data/questions.json sont écrits en live par le PHP
          # (voir public/admin/index.php et public/ask-question.php) : jamais
          # commités, donc exclus du déploiement pour ne pas être supprimés par ce sync.
          exclude: |
            **/data/faq.json
            **/data/questions.json
